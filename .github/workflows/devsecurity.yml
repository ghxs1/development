name: Security Scanning Pipeline

on:
  push:
    branches:
      - main

jobs:

  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install Semgrep
        run: pip install semgrep

      - name: Copy SAST script
        run: |
          sudo mkdir -p /security
          sudo cp security/run-sast.sh /security/run-sast.sh
          sudo chmod +x /security/run-sast.sh

      - name: Run SAST
        run: /security/run-sast.sh

  container-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Dockerfile
        run: |
          sudo mkdir -p /docker
          sudo cp docker/Dockerfile /docker/Dockerfile

      - name: Build Docker image
        run: |
          docker build \
            -f /docker/Dockerfile \
            -t myapp:${{ github.sha }} \
            .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Copy image scanning script
        run: |
          sudo mkdir -p /security
          sudo cp security/scan-image.sh /security/scan-image.sh
          sudo chmod +x /security/scan-image.sh

      - name: Scan container image
        run: |
          /security/scan-image.sh \
            myapp:${{ github.sha }}